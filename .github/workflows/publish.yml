name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # Required by npm trusted publishing and provenance generation.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24.12'

      - name: Verify tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-tag.mjs

      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm type-check:client
      - run: pnpm type-check:demo
      - run: pnpm test:all
      - run: pnpm build
      - run: pnpm verify:package
      - run: npm publish --provenance --access public
